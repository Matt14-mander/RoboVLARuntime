[runtime]
scheduler = "worker_async"
worker_prefetch = "adaptive"
worker_isolation = "process"
period_s = 0.02
duration_s = 4.0
chunk_size = 30
execute_horizon = 20
initial_position = [0.0, 0.0]
target_position = [1.0, 1.0]
request_timeout_s = 0.4
worker_close_timeout_s = 1.0
process_startup_timeout_s = 2.0
process_execution_timeout_s = 1.0
process_terminate_grace_s = 0.1
process_max_restarts = 1
