[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robovla-runtime"
version = "0.1.0"
description = "Deterministic runtime experiments for chunked robot policies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
robovla-runtime = "robovla_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

